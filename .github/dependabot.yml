version: 2
updates:
  # Pinned action SHAs are secure but go stale silently. This keeps them
  # moving without anyone having to remember.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "python"]
    # requirements-lock.txt is the validated environment and is regenerated
    # deliberately, not by a bot; see docs/dependencies.md.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
