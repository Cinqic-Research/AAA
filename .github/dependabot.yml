version: 2
updates:
  # Pinned action SHAs are secure but go stale silently. This keeps them
  # moving without anyone having to remember.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "python"]
    # requirements-lock.txt is the validated environment and is regenerated
    # deliberately, not by a bot; see docs/dependencies.md. It is also inside
    # the aaa.1k.v1 phase fingerprint, so any bot edit to it breaks Champion 0
    # and Champion 1 verification (AAA-175). Ignore every pip update. GitHub
    # documents `ignore` as applying to both version and security updates;
    # `open-pull-requests-limit: 0` disables version updates only. Dependabot
    # alerts still report vulnerable pins.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
