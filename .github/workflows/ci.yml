name: CPU CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m aaa.cli benchmark-v2 --role development --attempt-id ci-smoke --replicas 1 --episodes 2 --output-root /tmp/aaa-runs
