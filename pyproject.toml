[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aaa"
version = "0.1.0"
description = "An experimental AI research project exploring Accurate Autonomous Adaptation."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Cinqic"}]
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aaa = "aaa.cli:main"

[tool.setuptools.packages.find]
include = ["aaa*"]
